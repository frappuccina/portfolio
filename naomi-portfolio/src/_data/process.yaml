label: "Come lavoro"
title: "Il mio"
title_highlight: "processo"
steps:
  - num: "01"
    title: "Discover"
    desc: "Research qualitativa e quantitativa. Interviste utenti, analisi dei dati, benchmark competitivi."
  - num: "02"
    title: "Define"
    desc: "Sintesi degli insight, personas, journey map e problem statement condivisi con il team."
  - num: "03"
    title: "Design"
    desc: "Wireframes, design system, prototipi ad alta fedeltà. Iterazione rapida sui feedback."
  - num: "04"
    title: "Deliver"
    desc: "Handover agli sviluppatori, test di usabilità, validazione post-lancio e metriche di successo."
